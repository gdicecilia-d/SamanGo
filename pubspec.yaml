# Nombre del proyecto - no cambiar
name: samango
description: "A new Flutter project."

# Evita publicar accidentalmente en pub.dev
publish_to: 'none'

# Version de la app (mayor.menor.parche+buildnumber)
version: 1.0.0+1

# Version minima y maxima del SDK de Dart que acepta este proyecto
environment:
  sdk: '>=3.11.0 <4.0.0'

# Paquetes que necesita la app para funcionar
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.0
  share_plus: ^10.1.4
  permission_handler: ^11.0.0 

  # Iconos estilo iOS para Flutter
  cupertino_icons: ^1.0.8

  # Fuentes de Google (Outfit, etc.)
  google_fonts: ^8.1.0

  # Iconos de Font Awesome
  font_awesome_flutter: ^11.0.0

  # Firebase: inicializacion base (requerida por todos los servicios Firebase)
  firebase_core: ^4.9.0

  # Firebase: autenticacion de usuarios (login, registro, logout)
  firebase_auth: ^6.5.1

  # Firebase: base de datos en tiempo real (colecciones destinos, reservas, usuarios)
  cloud_firestore: ^6.5.0

  # Manejo de estado global con Provider (AuthController, etc.)
  provider: ^6.1.2

  # Guardar sesion en localStorage del navegador (persistencia en Web)
  shared_preferences: ^2.3.2

  # Firebase: subida y descarga de archivos e imagenes
  firebase_storage: ^13.4.1

  # Seleccion de archivos (PDF de licencia, etc.) desde el explorador de archivos
  file_picker: ^11.0.2

  # Seleccion de imagenes desde la galeria del dispositivo o camara
  image_picker: ^1.2.2

  # Compresion y redimensionado de imagenes antes de subir a Storage.
  # Sin este paquete las imagenes se suben en crudo (4-8MB cada una),
  # lo que causa el tiempo de publicacion excesivo.
  # Con este paquete se comprimen a ~200KB antes de subir.
  image: ^4.1.7
  mailer: ^7.1.0
  http: ^1.6.0
  google_sign_in: ^6.2.1

# Paquetes que solo se usan en desarrollo y testing (no van en la app final)
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Reglas de buenas practicas de codigo Dart
  flutter_lints: ^6.0.0

# Configuracion especifica de Flutter
flutter:
  # Incluye los iconos de Material Design (Icons.home, Icons.person, etc.)
  uses-material-design: true

  # Archivos estaticos incluidos en el bundle de la app
  assets:
    - assets/images/
    - assets/images/perfiles/